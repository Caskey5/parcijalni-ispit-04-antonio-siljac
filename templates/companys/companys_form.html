{% extends "base.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 700px;">

    <div class="card shadow-sm">
        <div class="card-body">

            <h4 class="card-title mb-4">
                {% if form.instance.pk %}
                    Edit Company
                {% else %}
                    Add New Company
                {% endif %}
            </h4>

            <form method="post" novalidate>
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'companys_list' %}" class="btn btn-outline-secondary">
                        Back
                    </a>
                    <button type="submit" class="btn btn-primary">
                        Save Company
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
